[mypy]
# Engine v2 + Arcus venue type-check config.
# Run: python -m mypy src/nadobro/engine src/nadobro/venue/arcus \
#        src/nadobro/users/arcus_credentials.py src/nadobro/users/arcus_link_service.py src/nadobro/utils/secret_text.py
python_version = 3.11
strict_optional = True
ignore_missing_imports = True
# Imports are absolute as ``src.nadobro.*``; anchor module paths at the repo
# root so a file isn't discovered under two module names.
mypy_path = .
explicit_package_bases = True
namespace_packages = True
# Only the engine is type-clean today; don't fail on legacy modules it imports.
follow_imports = silent
warn_redundant_casts = True
no_implicit_optional = True

# Arcus venue library (02 §9.6): the whole package is type-checked strictly and
# CI runs `python -m mypy src/nadobro/engine src/nadobro/venue/arcus`.
[mypy-src.nadobro.venue.arcus.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_return_any = True
warn_unused_ignores = True

# Arcus onboarding (P3b, 03 §20): the credential store, the link service and the
# secret-shape detector are type-checked with the same strictness; CI runs mypy on
# them next to the engine and the Arcus library.
[mypy-src.nadobro.users.arcus_credentials]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_return_any = True
warn_unused_ignores = True

[mypy-src.nadobro.users.arcus_link_service]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_return_any = True
warn_unused_ignores = True

[mypy-src.nadobro.utils.secret_text]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_return_any = True
warn_unused_ignores = True
