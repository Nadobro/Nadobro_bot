# fly.toml app configuration file generated for nadobro-bot on 2026-10-02T08:42:45Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'nadobro-bot'
primary_region = 'fra'
kill_signal = 'SIGTERM'
kill_timeout = '1m0s'

[build]
  dockerfile = 'Dockerfile'

[experimental]
  auto_rollback = true

[deploy]
  strategy = 'rolling'

[env]
  PYTHONUNBUFFERED = "1"
  PYTHONDONTWRITEBYTECODE = "1"
  ENVIRONMENT = "production"
  LOG_LEVEL = "INFO"
  TELEGRAM_TRANSPORT = "webhook"
  TELEGRAM_WEBHOOK_PATH = "/telegram/webhook"
  TELEGRAM_WEBHOOK_PORT = "8082"
  PORT = "8080"
  # Allow dual-stack (IPv4 + IPv6) egress. Fly static egress is an IPv4+IPv6
  # pair, so both are stable for Nado allowlisting; forcing IPv4-only also broke
  # IPv6-only upstreams (e.g. Supabase direct host → "No address associated
  # with hostname"). Set to "1" only if a destination must see the IPv4 egress.
  NADO_FORCE_IPV4 = "0"
  # Portfolio-sync SDK reads (calculate_account_summary, get_trigger_orders,
  # get_matches, get_interest_and_funding_payments) now route through the
  # dedicated SDK thread pool (run_blocking_sdk) instead of the shared default
  # executor. Worst-case fan-out is ~8 users/tick x 6 calls, and cancelled
  # wait_for calls leave their thread running until the socket timeout, so the
  # I/O-bound pool is widened from its 12-worker default to absorb bursts.
  NADO_SDK_POOL_WORKERS = "24"
  # Venue-side reduce-only stop backstop (PR #251): exchange-enforced stop that
  # fires even if the bot lags/disconnects. Lifecycle code complete + unit-tested
  # (dead-call, orphan cleanup, re-entry alignment, churn all fixed in the
  # 2026-08-25 self-review). ENABLED per owner decision BEFORE the live
  # trigger-service round-trip has been validated on testnet — WATCH on first
  # deploy: confirm get_trigger_orders shows reduce-only stops at the expected
  # mid_price_{below,above} + size; watch logs for `place_reduce_only_stop failed`
  # and orphan accumulation if _extract_digest/_row_is_reduce_only_stop don't
  # match the real payloads. reduce_only bounds the worst case to premature/no-op
  # closes (never grows/flips). Kill-switch: set to "0" + redeploy. The software
  # rail (buffer + fast poll) is the primary stop and stays on regardless.
  NADO_VENUE_STOP_ENABLED = "1"
  # Trigger-based Reverse Grid (PR #258/#259): routes the `rgrid` strategy to the
  # native venue price-trigger ReverseGridController instead of the maker-only one
  # (which placed 0 orders in a quiet book). ENABLED per owner decision — a
  # deliberate override of the "testnet paper run first" gate, so WATCH on first
  # deploy. Honest risk: a reverse grid WINS in trends and LOSES a little in chop
  # BY DESIGN; the chop stand-down gate (default ON) + the session %-of-margin rail
  # bound it (real-tape Aug-2026 validation: net + in trends, bounded chop loss,
  # fee_leak==0). It affects the STANDALONE rgrid only — D-Grid's trend phase keeps
  # the legacy RGridController (map_strategy_config `_for_dgrid_trend` guard).
  # WATCH: get_trigger_orders shows buy triggers ABOVE / sell triggers BELOW mid
  # while flat; on the first fill the opposite side cancels and ONE reduce-only stop
  # arms + trails; venue fills attribute to the run (turnover/PnL non-zero on
  # /status); logs `revgrid armed N trigger rungs` / `revgrid OPEN`. Kill-switch:
  # set to "0" + redeploy (rgrid reverts to the maker controller; the session rail
  # + venue stop keep protecting any open position either way).
  NADO_REVGRID_TRIGGER_ENABLED = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1
  processes = ['app']

# CPU-BOUND SIGNING (2026-08-28): each order placement is a secp256k1 signature.
# Mid re-quotes a ~20-24 order ladder per cycle (~1000 signed requests/session),
# and on a 1-CPU VM those signing threads contend with the event-loop thread for
# the single core — the bursty tap-latency the users reported. performance-2x
# gives the event loop its own core during placement bursts (2 dedicated CPUs,
# 4 GB). Note: applying this restarts the machine, which stands every running
# strategy down (redeploy = no auto-resume) — resume is user-initiated.
  checks = [{ grace_period = '10s', interval = '15s', method = 'GET', path = '/health', timeout = '2s' }]

[[vm]]
  memory = '4gb'
  cpu_kind = 'performance'
  cpus = 2
  memory_mb = 4096
  size = 'performance-2x'

[[vm]]
  memory = '4gb'
  cpu_kind = 'performance'
  cpus = 1
  memory_mb = 4096
  size = 'performance-cpu-1x'
  processes = ['app']
