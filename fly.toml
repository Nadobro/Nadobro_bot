# fly.toml app configuration file generated for nadobro-bot on 2026-05-18T07:01:13Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

# Region MUST stay in Europe: Postgres (Supabase, EU) and the @lowiqpts relay
# (nadobro-relay, primary_region='ams') both live there. A 'nrt' (Tokyo) machine
# put every DB round-trip and every relay poll ~230ms across the planet — that
# is what pinned button taps at multi-second latency and made the 1.5s relay
# poll time out every 2s (2026-08-14). 'fra' and 'ams' are both ~10ms from the
# relay+DB; keep it here unless the DB and relay move too.
app = 'nadobro-bot'
primary_region = 'fra'
kill_signal = 'SIGTERM'
kill_timeout = 60

[build]
  dockerfile = 'Dockerfile'

[experimental]
  auto_rollback = true

[deploy]
  strategy = 'rolling'

[env]
  PYTHONUNBUFFERED = "1"
  PYTHONDONTWRITEBYTECODE = "1"
  ENVIRONMENT = "production"
  LOG_LEVEL = "INFO"
  TELEGRAM_TRANSPORT = "webhook"
  TELEGRAM_WEBHOOK_PATH = "/telegram/webhook"
  TELEGRAM_WEBHOOK_PORT = "8082"
  PORT = "8080"
  # Allow dual-stack (IPv4 + IPv6) egress. Fly static egress is an IPv4+IPv6
  # pair, so both are stable for Nado allowlisting; forcing IPv4-only also broke
  # IPv6-only upstreams (e.g. Supabase direct host → "No address associated
  # with hostname"). Set to "1" only if a destination must see the IPv4 egress.
  NADO_FORCE_IPV4 = "0"
  # Portfolio-sync SDK reads (calculate_account_summary, get_trigger_orders,
  # get_matches, get_interest_and_funding_payments) now route through the
  # dedicated SDK thread pool (run_blocking_sdk) instead of the shared default
  # executor. Worst-case fan-out is ~8 users/tick x 6 calls, and cancelled
  # wait_for calls leave their thread running until the socket timeout, so the
  # I/O-bound pool is widened from its 12-worker default to absorb bursts.
  NADO_SDK_POOL_WORKERS = "24"
  # Venue-side reduce-only stop backstop (PR #251): exchange-enforced stop that
  # fires even if the bot lags/disconnects. reduce_only means the venue
  # guarantees it can only SHRINK a position, never grow/flip it. Enabled
  # globally per owner decision; the software session rail (buffer + fast poll)
  # remains the primary stop. Kill-switch: set to "0" to disarm instantly.
  NADO_VENUE_STOP_ENABLED = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'performance'
  cpus = 1
  memory_mb = 2048
  size = 'performance-1x'

[[http_service.checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "10s"
  method = "GET"
  path = "/health"
